version: "3.8"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: herbalai-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      POSTGRES_DB: ${POSTGRES_DB:-herbalai}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-herbalai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./herbalaibackend
      dockerfile: Dockerfile
    container_name: herbalai-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}@postgres:5432/${POSTGRES_DB:-herbalai}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in the root .env file}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      DR_AI_MAX_COSINE_DISTANCE: ${DR_AI_MAX_COSINE_DISTANCE:-0.52}
      DR_AI_CHAT_MODELS: ${DR_AI_CHAT_MODELS:-gemini-3.5-flash-lite,gemini-3.6-flash,gemini-2.5-flash-lite}
      DR_AI_MODEL_TIMEOUT_MS: ${DR_AI_MODEL_TIMEOUT_MS:-7000}
      HERB_CACHE_TTL_MS: ${HERB_CACHE_TTL_MS:-300000}
      SLOW_REQUEST_THRESHOLD_MS: ${SLOW_REQUEST_THRESHOLD_MS:-1000}
      DB_POOL_MIN: ${DB_POOL_MIN:-2}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_POOL_IDLE_TIMEOUT_MS: ${DB_POOL_IDLE_TIMEOUT_MS:-300000}
      DB_POOL_CONNECTION_TIMEOUT_MS: ${DB_POOL_CONNECTION_TIMEOUT_MS:-10000}
      DB_POOL_MAX_LIFETIME_SECONDS: ${DB_POOL_MAX_LIFETIME_SECONDS:-1800}
      DB_POOL_METRICS_INTERVAL_MS: ${DB_POOL_METRICS_INTERVAL_MS:-60000}
      AUTH_USER_CACHE_TTL_MS: ${AUTH_USER_CACHE_TTL_MS:-5000}
      AUTH_USER_CACHE_MAX_ENTRIES: ${AUTH_USER_CACHE_MAX_ENTRIES:-2000}
      EMAIL_DELIVERY_MODE: ${EMAIL_DELIVERY_MODE:-live}
      EMAIL_ALLOWED_RECIPIENTS: ${EMAIL_ALLOWED_RECIPIENTS:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@herbalai.ph}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the root .env file before seeding}
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./herbalaifrontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set the browser-facing NEXT_PUBLIC_API_URL in the root .env file}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:?Set the browser-facing NEXT_PUBLIC_SOCKET_URL in the root .env file}
    container_name: herbalai-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
